<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P0 - Primeiro Fluxo Com IA - Cliente</title>

    <link rel="stylesheet" href="/static/client.css" />
    <script defer src="/static/js/client.js"></script>
</head>
<body>
    
    <div class="main-container">
        <header class="header">
            <div class="header-container">
                <div>
                    <a href="/">
                        <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            width="24" 
                            height="24" 
                            viewBox="0 0 24 24" 
                            fill="none" 
                            stroke="currentColor" 
                            stroke-width="2" 
                            stroke-linecap="round" 
                            stroke-linejoin="round" 
                            class="lucide lucide-chevron-left preview-icon">
                                <path d="m15 18-6-6 6-6"/>
                        </svg>
                    </a>
                </div>
    
                <div>
                    <h3>Pizzaria nota 1000</h3>
                    <p class="status">Carregando....</p>
                </div>
            </div>
        </header>

        <div class="screen-error-state hidden">
            <p class="screen-error-state-icon">
                <svg 
                    xmlns="http://www.w3.org/2000/svg"
                    width="50" 
                    height="50" 
                    viewBox="0 0 24 24" 
                    fill="none" 
                    stroke="currentColor" 
                    stroke-width="2" 
                    stroke-linecap="round" 
                    stroke-linejoin="round">
                        <path d="M13.67 8H18a2 2 0 0 1 2 2v4.33"/>
                        <path d="M2 14h2"/>
                        <path d="M20 14h2"/>
                        <path d="M22 22 2 2"/>
                        <path d="M8 8H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 1.414-.586"/>
                        <path d="M9 13v2"/>
                        <path d="M9.67 4H12v2.33"/>
                </svg>
            </p>

            <h2>Erro na aplicação!</h2>
            <p>A aplicação apresentou erros na inicialização. Contate um administrador!</p>
        </div>

        <main class="chat-messages">
            <div class="chat-max-size-container">

                <div class="circular-loadding">
                    <div class="loadding"></div>
                </div>

    
                <div class="message animation-llm-response hidden">
                    <div class="user-circle">
                        PZ
                    </div>
    
                    <div class="text-message">
                        <span class="bullet"></span>
                        <span class="bullet"></span>
                        <span class="bullet"></span>
                    </div>
                </div>

            </div>
        </main>

        <div class="input-message-container">
            <div class="input-message-area">
                <textarea class="input-message" placeholder="Digite sua mensagem" disabled></textarea>

                <div class="input-message-btn-container">
                    <button class="button-send-message" disabled>
                        Enviar

                        <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            width="24" 
                            height="24" 
                            viewBox="0 0 24 24" 
                            fill="none" 
                            stroke="currentColor" 
                            stroke-width="2" 
                            stroke-linecap="round" 
                            stroke-linejoin="round">
                                <path d="M3.714 3.048a.498.498 0 0 0-.683.627l2.843 7.627a2 2 0 0 1 0 1.396l-2.842 7.627a.498.498 0 0 0 .682.627l18-8.5a.5.5 0 0 0 0-.904z"/>
                                <path d="M6 12h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
