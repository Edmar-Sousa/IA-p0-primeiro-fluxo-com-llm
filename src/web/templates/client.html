<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P0 - Primeiro Fluxo Com IA - Cliente</title>

    <link rel="stylesheet" href="/static/client.css" />
    <script defer src="/static/js/client.js"></script>
</head>
<body>
    
    <div class="main-container">
        <header class="header">
            <div>
                <a href="/">
                    <svg 
                        xmlns="http://www.w3.org/2000/svg" 
                        width="24" 
                        height="24" 
                        viewBox="0 0 24 24" 
                        fill="none" 
                        stroke="currentColor" 
                        stroke-width="2" 
                        stroke-linecap="round" 
                        stroke-linejoin="round" 
                        class="lucide lucide-chevron-left preview-icon">
                            <path d="m15 18-6-6 6-6"/>
                    </svg>
                </a>
            </div>

            <div>
                <h3>Pizzaria nota 1000</h3>
                <p class="status">carregando....</p>
            </div>
        </header>

        <div class="loadding-state">
            <p>Carregando...</p>
        </div>

        <div class="error hidden"><h3></h3></div>

        <main class="messages-area hidden">
        </main>

        <div class="message-input-area hidden">
            <div class="input-message-container">
                <div
                    contenteditable
                    name="message" 
                    class="input-message">
                </div>
            </div>
            
            <button class="btn-send">
                Enviar
            </button>
        </div>
    </div>

</body>
</html>
